version: '3.8'

services:
  # ==================================
  # PostgreSQL Database
  # ==================================
  db:
    image: postgres:15-alpine
    container_name: fatigue_detection_db
    environment:
      POSTGRES_DB: ${DB_NAME:-fatigue_detection_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fatigue_network

  # ==================================
  # MQTT Broker (Eclipse Mosquitto)
  # ==================================
  mqtt:
    image: eclipse-mosquitto:2
    container_name: fatigue_detection_mqtt
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "9001:9001"  # WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - fatigue_network
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 | grep -v Error || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================================
  # Django Backend
  # ==================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fatigue_detection_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-fatigue_detection_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    networks:
      - fatigue_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/docs/\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================================
  # MQTT Client Service
  # ==================================
  mqtt_client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fatigue_detection_mqtt_client
    command: python -c "from apps.mqtt_client.apps import MqttClientConfig; MqttClientConfig.start_mqtt_client()"
    volumes:
      - .:/app
    environment:
      - DB_NAME=${DB_NAME:-fatigue_detection_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
    depends_on:
      - db
      - mqtt
      - backend
    networks:
      - fatigue_network
    restart: unless-stopped

  # ==================================
  # Nginx Reverse Proxy (Production)
  # ==================================
  nginx:
    image: nginx:alpine
    container_name: fatigue_detection_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - fatigue_network
    profiles:
      - production

# ==================================
# Volumes
# ==================================
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# ==================================
# Networks
# ==================================
networks:
  fatigue_network:
    driver: bridge
